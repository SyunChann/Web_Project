<!doctype html>
<html lang="ko">
  <body style="margin:0;padding:32px 16px;background:#f5f6f8;color:#17202a;font-family:Arial,sans-serif;">
    <main style="max-width:480px;margin:auto;padding:28px;background:#ffffff;border:1px solid #ddd6cc;border-radius:12px;">
      <p style="color:#be4b49;font-size:14px;font-weight:700;">취향보관소</p>
      <h1 style="font-size:24px;">이메일을 인증해 주세요</h1>
      <p style="font-size:15px;line-height:1.8;">아래 버튼으로 이동한 뒤 인증을 완료하면 취향 기록을 남길 수 있습니다.</p>
      <p style="margin:28px 0;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:14px 20px;background:#be4b49;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:700;">이메일 인증하기</a></p>
      <p style="font-size:12px;line-height:1.8;color:#64748b;">가입을 요청하지 않았다면 이 메일을 무시해 주세요. 링크가 만료되면 회원가입 화면에서 인증 메일을 다시 요청할 수 있습니다.</p>
    </main>
  </body>
</html>
